name: RIMS source security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Source security on Python3.15.1
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Check caller full history for secrets
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact --no-banner
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Create verified repository-local Python
        env:
          BOOTSTRAP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: bash scripts/create_ci_python_env.sh "$BOOTSTRAP_PYTHON" .venv-security 3.15.1
      - name: Install exact RIMS tool lock on the selected interpreter
        run: uv pip sync --python .venv-security/bin/python --require-hashes requirements-dev.txt
      - name: Verify runtime and dependency consistency
        run: |
          .venv-security/bin/python -c "import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version"
          .venv-security/bin/python -m pip check
      - run: .venv-security/bin/python scripts/check_workflow_references.py
      - name: Validate workflow syntax and security
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          .venv-security/bin/zizmor --offline --strict-collection --persona pedantic --format plain .github/workflows
