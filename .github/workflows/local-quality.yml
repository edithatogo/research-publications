name: RIMS local quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rims-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-quality:
    name: Source-only validation
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'

      - name: Create and verify explicit repository Python
        env:
          BOOTSTRAP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: bash scripts/create_ci_python_env.sh "$BOOTSTRAP_PYTHON" .venv-ci 3.15.1

      - name: Run unit tests
        run: .venv-ci/bin/python -m unittest discover -s tests -v

      - name: Offline qualified CLI guards
        run: node --test tests/test_m365_qualified.mjs tests/test_m365_workload_lock.mjs tests/test_sharepoint_change_log_read.mjs

      - name: Check offline comparator CLI portability without site packages
        run: .venv-ci/bin/python -S scripts/check_reconciliation_portability.py --smoke-only

      - name: Validate project contracts
        run: .venv-ci/bin/python scripts/validate_project.py

      - name: Validate web-first contracts
        run: .venv-ci/bin/python scripts/webfirst_contracts.py validate

      - name: Validate Conductor structure
        run: .venv-ci/bin/python scripts/validate_conductor.py

      - name: Run read-only Power Platform tooling preflight
        run: .venv-ci/bin/python scripts/powerplatform_tooling.py check

      - name: Validate visual standards
        run: .venv-ci/bin/python scripts/validate_visual_standards.py

      - name: Validate canonical flow contracts
        run: |
          .venv-ci/bin/python scripts/validate_publication_platform_contract.py
          .venv-ci/bin/python scripts/validate_grants_flow_contract.py
          .venv-ci/bin/python scripts/validate_dora_activity_flow_contract.py

  locked-dependencies:
    name: Python3.15.1 locked artifact dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'

      - name: Create and verify explicit repository Python
        env:
          BOOTSTRAP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: bash scripts/create_ci_python_env.sh "$BOOTSTRAP_PYTHON" .venv-ci 3.15.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Install exact hash-locked development dependencies
        run: uv pip sync --python "$GITHUB_WORKSPACE/.venv-ci/bin/python" --require-hashes requirements-dev.txt
      - name: Verify installed dependency metadata and artifact libraries
        run: |
          .venv-ci/bin/python -m pip check
          .venv-ci/bin/python -c "import sys, certifi, docx, lxml.etree, openpyxl; assert sys.version_info[:3] == (3, 15, 1)"
      - run: .venv-ci/bin/python -m unittest discover -s tests -v
      - run: .venv-ci/bin/python scripts/validate_project.py
      - run: .venv-ci/bin/python scripts/webfirst_contracts.py validate
      - run: .venv-ci/bin/python scripts/validate_conductor.py
